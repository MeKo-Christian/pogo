name: test-format
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.14.0
      - name: Install formatters and linters
        run: just setup-deps
      - name: Run treefmt
        run: just check-formatted
